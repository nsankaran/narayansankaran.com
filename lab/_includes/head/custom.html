<!-- start custom head snippets -->

<style>
  /* Shrink the masthead title and nav tab labels so all 5 nav tabs fit
     alongside the long site title without collapsing into the hidden menu. */
  .masthead .site-title {
    font-size: 0.9rem;
  }

  .greedy-nav .visible-links a {
    margin: 0 0.3rem;
    font-size: 0.75rem;
  }

  /* feature_row (used on the Research Projects page) floats items with
     unequal heights, so a long card pushes the next row out of alignment.
     Use CSS grid instead so each row's height matches its tallest card. */
  .layout--single .feature__wrapper {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 2em;
  }

  .feature__item {
    float: none;
    width: auto;
    margin-bottom: 2em;
  }

  @media (max-width: 600px) {
    .layout--single .feature__wrapper {
      grid-template-columns: 1fr;
    }
  }

  /* Minimal Mistakes' `wide` class only zeroes the padding it reserves for a
     right-hand table-of-contents sidebar - `.page` still keeps its reduced
     width and floats right, so sidebar-less "wide" pages end up hugging the
     right edge with the leftover width as empty space on the left. Actually
     fill the container so content is centered. */
  .wide .page {
    float: none;
    width: 100%;
  }

  /* Principal Investigator profile on the People page: photo + bio side by side */
  .pi-profile {
    display: flex;
    gap: 2.5em;
    align-items: flex-start;
    flex-wrap: wrap;
    margin-bottom: 2em;
  }

  .pi-photo {
    width: 220px;
    height: 220px;
    flex-shrink: 0;
  }

  .pi-bio {
    flex: 1;
    min-width: 280px;
  }

  .pi-bio h3 {
    margin-top: 0;
  }

  /* Contact page: map + address side by side, and a "pop out" shadow on the
     recruitment brochure image */
  .location-block {
    display: flex;
    gap: 2em;
    align-items: flex-start;
    flex-wrap: wrap;
    margin: 1.5em 0 2em;
  }

  .location-map {
    flex: 2;
    min-width: 300px;
    height: 350px;
    border: 0;
    border-radius: 4px;
  }

  .location-address {
    flex: 1;
    min-width: 240px;
    font-size: 1.05em;
    line-height: 1.6;
  }

  .brochure-image {
    display: block;
    max-width: 500px;
    width: 100%;
    margin: 2em auto;
    border-radius: 6px;
    box-shadow:
      0 20px 40px rgba(0, 0, 0, 0.3),
      0 6px 16px rgba(0, 0, 0, 0.2);
  }
</style>

<!-- end custom head snippets -->
